
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .scene {
    width: 100%;
    aspect-ratio: 16/9;
    background: #1a1a1a;
    position: relative;
    overflow: hidden;
    font-family: Georgia, 'Times New Roman', serif;
    cursor: pointer;
  }
  .grid-lines { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease; }
  .grid-lines line { stroke: #CC0000; stroke-width: 0.4; opacity: 0.3; }
  .grid-lines.visible { opacity: 1; }
  .red-burst {
    position: absolute; left: 50%; top: 50%;
    width: 0; height: 0; border-radius: 50%;
    background: #CC0000;
    transform: translate(-50%, -50%);
    opacity: 0;
  }
  .particles-container { position: absolute; inset: 0; pointer-events: none; }
  .particle { position: absolute; width: 2px; height: 2px; background: #CC0000; border-radius: 50%; opacity: 0; }
  .tagline {
    position: absolute; bottom: 18%; left: 50%;
    transform: translateX(-50%);
    color: #b8a98a;
    font-family: Arial, sans-serif;
    font-size: clamp(9px, 1.4vw, 14px);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    opacity: 0; white-space: nowrap;
  }
  .logo-mark {
    position: absolute; top: 12%; left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .pivot-yes-text { color: #b8a98a; font-family: Arial, sans-serif; font-size: clamp(8px, 1.1vw, 11px); letter-spacing: 0.3em; text-transform: uppercase; }
  .pivot-line { width: 40px; height: 1px; background: #CC0000; }
  .main-title { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; opacity: 0; }
  .launch-word { display: block; color: #f0ece4; font-family: 'Arial Black', Arial, sans-serif; font-size: clamp(28px, 7vw, 72px); font-weight: 900; letter-spacing: 0.15em; text-transform: uppercase; line-height: 1; }
  .mode-word { display: block; color: #CC0000; font-family: 'Arial Black', Arial, sans-serif; font-size: clamp(28px, 7vw, 72px); font-weight: 900; letter-spacing: 0.35em; text-transform: uppercase; line-height: 1; margin-top: 4px; }
  .underline-bar { display: block; height: 3px; background: #CC0000; width: 0; margin: 12px auto 0; transition: width 0.6s cubic-bezier(0.4,0,0.2,1); }
  .replay-btn {
    position: absolute; bottom: 5%; right: 5%;
    background: transparent; border: 1px solid #CC0000;
    color: #CC0000; font-family: Arial, sans-serif;
    font-size: clamp(8px, 1.1vw, 11px); letter-spacing: 0.2em;
    text-transform: uppercase; padding: 6px 14px; cursor: pointer; opacity: 0; transition: background 0.2s;
  }
  .replay-btn:hover { background: rgba(204,0,0,0.15); }
  .countdown { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #CC0000; font-family: 'Arial Black', Arial, sans-serif; font-size: clamp(40px, 12vw, 120px); font-weight: 900; opacity: 0; }
  .scan-line { position: absolute; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, #CC0000, transparent); top: -10%; opacity: 0; }
  .sound-btn {
    position: absolute; bottom: 5%; left: 5%;
    background: transparent; border: 1px solid #444;
    color: #888; font-family: Arial, sans-serif;
    font-size: clamp(8px, 1.1vw, 11px); letter-spacing: 0.2em;
    text-transform: uppercase; padding: 6px 14px; cursor: pointer; opacity: 0; transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .sound-btn:hover { background: rgba(255,255,255,0.05); }
  .sound-btn.on { border-color: #CC0000; color: #CC0000; }
</style>

<div class="scene" id="scene" onclick="replayAnimation()">
  <svg class="grid-lines" id="gridLines" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="particles-container" id="particles"></div>
  <div class="red-burst" id="redBurst"></div>
  <div class="scan-line" id="scanLine"></div>
  <div class="logo-mark" id="logoMark">
    <span class="pivot-yes-text">PivotYes</span>
    <div class="pivot-line"></div>
  </div>
  <div class="countdown" id="countdown"></div>
  <div class="main-title" id="mainTitle">
    <span class="launch-word" id="launchWord">Launch</span>
    <span class="mode-word" id="modeWord">Mode</span>
    <span class="underline-bar" id="underlineBar"></span>
  </div>
  <div class="tagline" id="tagline">You have the instinct.&nbsp;&nbsp;We give you the map.</div>
  <button class="sound-btn on" id="soundBtn" onclick="event.stopPropagation(); toggleSound()">♪ Sound on</button>
  <button class="replay-btn" id="replayBtn" onclick="event.stopPropagation(); replayAnimation()">↺ Replay</button>
</div>

<script>
let audioCtx = null;
let soundEnabled = true;

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('soundBtn');
  btn.textContent = soundEnabled ? '♪ Sound on' : '♪ Sound off';
  btn.classList.toggle('on', soundEnabled);
}

function playTone(freq, type, startTime, duration, gainVal, fadeOut) {
  if (!soundEnabled) return;
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(gainVal, startTime);
  if (fadeOut) gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.start(startTime);
  osc.stop(startTime + duration);
}

function playNoise(startTime, duration, gainVal) {
  if (!soundEnabled) return;
  const ctx = getCtx();
  const bufSize = ctx.sampleRate * duration;
  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 800;
  filter.Q.value = 0.5;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(gainVal, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  src.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  src.start(startTime);
  src.stop(startTime + duration);
}

function playGridHum(startTime) {
  if (!soundEnabled) return;
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(60, startTime);
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(0.04, startTime + 0.3);
  gain.gain.linearRampToValueAtTime(0.02, startTime + 1.0);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + 1.5);
  osc.start(startTime);
  osc.stop(startTime + 1.5);
}

function playScanLine(startTime) {
  if (!soundEnabled) return;
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(1200, startTime);
  osc.frequency.linearRampToValueAtTime(400, startTime + 0.6);
  gain.gain.setValueAtTime(0.12, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.6);
  osc.start(startTime);
  osc.stop(startTime + 0.65);
}

function playCountdownBeep(startTime, isLast) {
  if (!soundEnabled) return;
  const ctx = getCtx();
  const freq = isLast ? 880 : 440;
  const dur = isLast ? 0.25 : 0.15;
  playTone(freq, 'square', startTime, dur, isLast ? 0.18 : 0.12, true);
  if (isLast) {
    playTone(freq * 1.5, 'sine', startTime, dur * 0.8, 0.08, true);
  }
}

function playImpact(startTime) {
  if (!soundEnabled) return;
  const ctx = getCtx();
  // Low thud
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(120, startTime);
  osc.frequency.exponentialRampToValueAtTime(40, startTime + 0.3);
  gain.gain.setValueAtTime(0.5, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);
  osc.start(startTime); osc.stop(startTime + 0.45);
  // Burst noise
  playNoise(startTime, 0.3, 0.3);
  // High crack
  playTone(2000, 'sawtooth', startTime, 0.08, 0.15, true);
}

function playTitleSlam(startTime) {
  if (!soundEnabled) return;
  const ctx = getCtx();
  // Whoosh in
  const osc1 = ctx.createOscillator();
  const gain1 = ctx.createGain();
  osc1.connect(gain1); gain1.connect(ctx.destination);
  osc1.type = 'sawtooth';
  osc1.frequency.setValueAtTime(200, startTime);
  osc1.frequency.exponentialRampToValueAtTime(80, startTime + 0.25);
  gain1.gain.setValueAtTime(0.2, startTime);
  gain1.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);
  osc1.start(startTime); osc1.stop(startTime + 0.4);
  // Slam hit
  playTone(55, 'sine', startTime + 0.2, 0.5, 0.4, true);
  playNoise(startTime + 0.2, 0.2, 0.2);
}

function playTaglineChime(startTime) {
  if (!soundEnabled) return;
  const ctx = getCtx();
  [523, 659, 784].forEach((freq, i) => {
    playTone(freq, 'sine', startTime + i * 0.12, 0.6, 0.08, true);
  });
}

function buildGrid() {
  const svg = document.getElementById('gridLines');
  const W = 1920, H = 1080;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  let html = '';
  for (let x = 0; x <= W; x += 60) html += `<line x1="${x}" y1="0" x2="${x}" y2="${H}"/>`;
  for (let y = 0; y <= H; y += 60) html += `<line x1="0" y1="${y}" x2="${W}" y2="${H}"/>`;
  for (let y = 0; y <= H; y += 60) html += `<line x1="0" y1="${y}" x2="${W}" y2="${y}"/>`;
  svg.innerHTML = html;
}

function spawnParticles() {
  const container = document.getElementById('particles');
  container.innerHTML = '';
  const scene = document.getElementById('scene');
  const W = scene.offsetWidth, H = scene.offsetHeight;
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const cx = W / 2, cy = H / 2;
    const angle = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 200;
    const tx = Math.cos(angle) * dist, ty = Math.sin(angle) * dist;
    p.style.left = cx + 'px'; p.style.top = cy + 'px';
    p.style.background = Math.random() > 0.5 ? '#CC0000' : '#b8a98a';
    p.style.width = (1 + Math.random() * 2) + 'px';
    p.style.height = p.style.width;
    const delay = 0 + Math.random() * 200;
    setTimeout(() => {
      p.style.opacity = '1';
      p.style.transition = `transform ${400 + Math.random()*400}ms cubic-bezier(0.2,0,0.6,1), opacity 300ms ease ${300 + Math.random()*200}ms`;
      p.style.transform = `translate(${tx}px, ${ty}px)`;
      setTimeout(() => { p.style.opacity = '0'; }, 500);
    }, delay);
    container.appendChild(p);
  }
}

function animateScanLine() {
  const line = document.getElementById('scanLine');
  line.style.opacity = '1';
  line.style.transition = 'top 0.7s cubic-bezier(0.4,0,0.2,1)';
  setTimeout(() => { line.style.top = '110%'; }, 50);
  setTimeout(() => { line.style.opacity = '0'; line.style.top = '-10%'; line.style.transition = 'none'; }, 800);
}

function fadeIn(el, duration, delay) {
  setTimeout(() => { el.style.transition = `opacity ${duration}ms ease`; el.style.opacity = '1'; }, delay);
}
function fadeOut(el, duration, delay) {
  setTimeout(() => { el.style.transition = `opacity ${duration}ms ease`; el.style.opacity = '0'; }, delay);
}

function burstEffect() {
  const b = document.getElementById('redBurst');
  b.style.transition = 'none';
  b.style.width = '0'; b.style.height = '0'; b.style.opacity = '0.8';
  setTimeout(() => {
    b.style.transition = 'width 0.5s ease-out, height 0.5s ease-out, opacity 0.4s ease 0.2s';
    b.style.width = '200%'; b.style.height = '200%'; b.style.opacity = '0';
  }, 20);
}

function runAnimation() {
  const ids = ['gridLines','logoMark','countdown','mainTitle','tagline','replayBtn','soundBtn'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    el.style.transition = 'none';
    el.style.opacity = id === 'soundBtn' ? '0' : '0';
  });
  document.getElementById('underlineBar').style.width = '0';
  document.getElementById('launchWord').style.transform = 'translateY(0)';
  document.getElementById('modeWord').style.transform = 'translateY(0)';
  document.getElementById('redBurst').style.width = '0';
  document.getElementById('redBurst').style.height = '0';
  document.getElementById('scanLine').style.top = '-10%';

  buildGrid();

  // Resume audio context if suspended
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  const ctx = getCtx();
  const t0 = ctx.currentTime + 0.05;

  // Phase 1: Grid (0.2s)
  fadeIn(document.getElementById('gridLines'), 600, 200);
  playGridHum(t0 + 0.2);

  // Phase 2: Logo (0.6s)
  fadeIn(document.getElementById('logoMark'), 500, 600);

  // Phase 3: Scan line (1.1s)
  setTimeout(() => animateScanLine(), 1100);
  playScanLine(t0 + 1.1);

  // Phase 4: Countdown 3 2 1
  const cd = document.getElementById('countdown');
  [3, 2, 1].forEach((n, i) => {
    const ms = 1500 + i * 500;
    setTimeout(() => {
      cd.style.transition = 'none';
      cd.style.opacity = '1';
      cd.textContent = n;
      setTimeout(() => { cd.style.transition = 'opacity 0.3s ease'; cd.style.opacity = '0'; }, 350);
    }, ms);
    playCountdownBeep(t0 + ms / 1000, n === 1);
  });

  // Phase 5: Burst + particles (3.0s)
  setTimeout(() => { burstEffect(); spawnParticles(); }, 3000);
  playImpact(t0 + 3.0);

  // Phase 6: Title slam (3.2s)
  setTimeout(() => {
    const title = document.getElementById('mainTitle');
    title.style.transition = 'none'; title.style.opacity = '0';
    document.getElementById('launchWord').style.transform = 'translateY(-20px)';
    document.getElementById('modeWord').style.transform = 'translateY(20px)';
    setTimeout(() => {
      title.style.transition = 'opacity 0.5s ease';
      title.style.opacity = '1';
      document.getElementById('launchWord').style.transition = 'transform 0.6s cubic-bezier(0.2,0,0.2,1)';
      document.getElementById('modeWord').style.transition = 'transform 0.6s cubic-bezier(0.2,0,0.2,1) 0.1s';
      document.getElementById('launchWord').style.transform = 'translateY(0)';
      document.getElementById('modeWord').style.transform = 'translateY(0)';
      setTimeout(() => { document.getElementById('underlineBar').style.width = '100%'; }, 400);
    }, 50);
  }, 3200);
  playTitleSlam(t0 + 3.2);

  // Phase 7: Tagline (4.2s)
  fadeIn(document.getElementById('tagline'), 700, 4200);
  playTaglineChime(t0 + 4.2);

  // Phase 8: Cleanup + buttons
  fadeOut(document.getElementById('gridLines'), 800, 4800);
  fadeIn(document.getElementById('replayBtn'), 500, 5200);
  fadeIn(document.getElementById('soundBtn'), 500, 5200);
}

function replayAnimation() { runAnimation(); }

buildGrid();
setTimeout(runAnimation, 400);
</script>
